<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- TailwindCSS -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

	<!-- Funcionalidade do site -->
	<script src="../scripts/pages/update.js" type="module"></script>

	<title>Restaurante | Gerenciar Produtos</title>
</head>

<body class="flex flex-col min-h-svh">
	<header class="p-4 bg-blue-500">
		<a href="menu-admin.html" class="absolute">Voltar</a>
		<h1 class="text-center text-2xl">Gestão</h1>
	</header>

	<main class="grow p-4">
		<h2 class="text-xl">Editar Produto</h2>
		<p class="text-gray-500">Clique em uma linha da tabela para selecionar um produto.</p>
		<form id="form-edit" class="my-4 max-w-200">
			<div class="md:flex md:items-center mb-4">
				<div class="md:w-1/3">
					<label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="input-edit-id">
						ID
					</label>
				</div>
				<div class="md:w-2/3">
					<input
						class="bg-gray-100 appearance-none border-2 border-gray-200 rounded w-full p-2 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
						id="input-edit-id" type="text" disabled>
				</div>
			</div>
			<div class="md:flex md:items-center mb-4">
				<div class="md:w-1/3">
					<label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="input-edit-name">
						Nome
					</label>
				</div>
				<div class="md:w-2/3">
					<input
						class="appearance-none border-2 border-gray-200 rounded w-full p-2 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
						id="input-edit-name" type="text" required>
				</div>
			</div>
			<div class="md:flex md:items-center mb-4">
				<div class="md:w-1/3">
					<label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="input-edit-description">
						Descrição
					</label>
				</div>
				<div class="md:w-2/3">
					<input
						class="appearance-none border-2 border-gray-200 rounded w-full p-2 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
						id="input-edit-description" type="text" required>
				</div>
			</div>
			<div class="md:flex md:items-center mb-4">
				<div class="md:w-1/3">
					<label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4 no-spinner" for="input-edit-price">
						Preço
					</label>
				</div>
				<div class="md:w-2/3">
					<input
						class="appearance-none border-2 border-gray-200 rounded w-full p-2 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
						id="input-edit-price" type="number" required min="0" step="0.01">
				</div>
			</div>
			<div class="md:flex md:items-center mb-4">
				<div class="md:w-1/3">
					<label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="select-edit-category">
						Categoria
					</label>
				</div>
				<div class="md:w-2/3">
					<select
						class="appearance-none border-2 border-gray-200 rounded w-full p-2 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
						id="select-edit-category" required>
						<option selected disabled value="">-- Selecione --</option>
						<option value="Porções">Porções</option>
						<option value="Hambúrgueres">Hambúrgueres</option>
						<option value="Bebidas">Bebidas</option>
						<option value="Sobremesas">Sobremesas</option>
					</select>
				</div>
			</div>
			<div class="md:flex md:items-center mb-4">
				<div class="md:w-1/3">
					<label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="input-edit-image">
						Imagem
					</label>
				</div>
				<div class="md:w-2/3">
					<input
						class="appearance-none border-2 border-gray-200 rounded w-full p-2 text-gray-700 leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
						id="input-edit-image"
						type="text"
						placeholder="https://picsum.photos/400/300"
						value="https://picsum.photos/400/300">
				</div>
			</div>
			<div class="md:flex md:items-center">
				<div class="md:w-1/3"></div>
				<div class="md:w-2/3">
					<button
						class="shadow bg-purple-500 hover:bg-purple-400 focus:shadow-outline focus:outline-none text-white font-bold p-2 rounded cursor-pointer"
						type="submit"
						id="button-edit-save">
						Salvar
					</button>
					<button
						class="shadow bg-red-500 hover:bg-red-400 focus:shadow-outline focus:outline-none text-white font-bold p-2 rounded cursor-pointer"
						type="button"
						id="button-edit-delete">
						Excluir
					</button>
				</div>
			</div>
		</form>

		<h2 class="text-xl">Produtos Cadastrados</h2>
		<div class="overflow-x-auto">
			<table class="table-auto my-4 border border-collapse border-black">
				<thead>
					<tr>
						<th class="p-2 border">ID</th>
						<th class="p-2 border">Nome</th>
						<th class="p-2 border">Descrição</th>
						<th class="p-2 border">Preço</th>
						<th class="p-2 border">Categoria</th>
						<th class="p-2 border">Imagem</th>
					</tr>
				</thead>
				<tbody id="table-body">
					<tr>
						<!-- Lista de produtos cadastrados -->
					</tr>
				</tbody>
			</table>
		</div>

	</main>
</body>

</html>
